[package]
name = "unmcpk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fast, fully automated unpacker for NetEase MCPK containers and their obfuscated Python 2.7 bytecode"
license = "MIT"

[[bin]]
name = "unmcpk"
path = "src/main.rs"

[lib]
name = "unmcpk"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
encoding_rs = "0.8"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
